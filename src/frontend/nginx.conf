server {
    listen 80;
    root /usr/share/nginx/html;

    # Two PDFs of up to 50 MB each in one upload.
    client_max_body_size 110m;

    # /api/... goes to the FastAPI service with the /api prefix removed.
    location /api/ {
        proxy_pass http://ciwc-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Live job status is a long-lived Server-Sent Events stream: don't buffer it or time it out early.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # The live status URL carries the login token, so keep it out of the access log.
    location /api/jobs/stream {
        access_log off;
        proxy_pass http://ciwc-api:8000/jobs/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Built assets have hashed names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}

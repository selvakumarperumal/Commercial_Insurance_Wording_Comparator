[project]
name = "ciwc-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Selvakumar Perumal", email = "selvakumarp@proton.me" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic[email]>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "sqlmodel>=0.0.49",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
